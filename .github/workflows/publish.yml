name: Publish download

# The app's private repository builds each release and pushes the APK to the
# "incoming" branch here. This workflow turns that into a release, then
# deletes the branch so the APK is not kept in git.
on:
  push:
    branches: [incoming]

permissions:
  contents: write

concurrency:
  group: publish-download
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION does not look like a version number."
            exit 1
          fi
          if [ ! -s FlatMates.apk ]; then
            echo "::error::FlatMates.apk is missing or empty."
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" FlatMates.apk --clobber
          else
            # The tag goes on main, not on the commit that carries the APK.
            gh release create "$tag" FlatMates.apk \
              --target main \
              --title "FlatMates $version for Android" \
              --notes "Download **FlatMates.apk** below on your Android phone and open it to install. The first time, Android asks you to allow installs from your browser or file manager. Installing over an older version keeps you signed in."
          fi

      - name: Remove the incoming branch
        if: always()
        run: git push origin --delete incoming
